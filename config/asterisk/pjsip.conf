; /etc/asterisk/pjsip.conf
;
; NTT フレッツ光ネクスト ひかり電話 直収用の設定
; 解説: docs/03-hikari-denwa.md
;
; 置き換えが必要な値:
;   0xxxxxxxxx      … 電話番号（DHCP の ntt.number）
;   ntt-west.ne.jp  … SIP ドメイン（DHCP の ntt.domain。西日本の例）
;   124.xxx.xxx.1   … SIP サーバ（DHCP の ip-sip-servers）

[global]
type = global
debug = no

[system]
type = system
disable_rport = yes ;Viaヘッダにrportを入れないために必須（Asterisk 16.12.0+ / 18.0.0+）

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0

;----------------------------------------------------------------------
; ひかり電話
;----------------------------------------------------------------------
[reg_HIKARI-DENWA]
type = registration
contact_user = 0xxxxxxxxx ;電話番号（DHCPのntt.number）
transport = transport-udp
client_uri = sip:0xxxxxxxxx@ntt-west.ne.jp ;"電話番号@ntt.domain" であること
server_uri = sip:ntt-west.ne.jp ;ntt.domain であること（IPアドレスだと400 Bad Request）

[HIKARI-DENWA]
type = aor
contact = sip:124.xxx.xxx.1 ;DHCPのip-sip-servers

[HIKARI-DENWA]
type = identify
endpoint = HIKARI-DENWA
match = 124.xxx.xxx.1 ;DHCPのip-sip-servers

[HIKARI-DENWA]
type = endpoint
context = incoming ;extensions.confの着信用コンテキスト
disallow = all
allow = ulaw
rtp_symmetric = no ;Viaヘッダにrportを入れないために必須（sip.confのnat=never相当）
force_rport = no ;同上
rewrite_contact = no ;同上
direct_media = no ;RTPをAsteriskで中継する
from_domain = ntt-west.ne.jp ;ntt.domain であること
aors = HIKARI-DENWA

;----------------------------------------------------------------------
; 内線（宅内の SIP 電話機）
; 元記事では省略していた部分。環境に合わせて設定する。
;----------------------------------------------------------------------
[100]
type = aor
max_contacts = 1

[100]
type = auth
auth_type = userpass
username = 100
password = CHANGE_ME

[100]
type = endpoint
context = default
disallow = all
allow = ulaw
auth = 100
aors = 100
