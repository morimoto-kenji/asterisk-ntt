; /etc/asterisk/extensions.conf
;
; 解説: docs/03-hikari-denwa.md, docs/04-bluetooth-mobile.md
;
; 置き換えが必要な値:
;   0xxxxxxxxx … ひかり電話の電話番号

[general]
writeprotect=no
priorityjumping=no

[globals]
USEVOICEMAIL=NO
MYNUMBER=0xxxxxxxxx
PHONEALL=PJSIP/100 ;着信時に鳴らす電話機（複数なら PJSIP/100&PJSIP/101 のように & でつなぐ）

;----------------------------------------------------------------------
; 内線電話機からの発信
;----------------------------------------------------------------------
[default]
; 内線
exten => 100,1,Dial(PJSIP/100)
exten => 100,n,Hangup

; 00 で始まる番号 → 先頭の 0 を除いて携帯電話（回線B）から発信（docs/04）
exten => _00Z.,1,Dial(Mobile/iPhone5s/${EXTEN:1})
exten => _00Z.,n,Hangup

; それ以外 → ひかり電話から発信（docs/03）
exten => _X.,1,Set(CALLERID(num)=${MYNUMBER})
exten => _X.,2,Set(CALLERID(name)=${MYNUMBER})
exten => _X.,3,Dial(PJSIP/${EXTEN}@HIKARI-DENWA)
exten => _X.,n,Hangup

;----------------------------------------------------------------------
; ひかり電話からの着信
; 非通知・0120・0800 は電話機を鳴らさずに応答して切断する
;----------------------------------------------------------------------
[incoming]
exten => _X.,1,Set(free_dial="0120")
exten => _X.,2,Set(free_call="0800")
exten => _X.,3,GotoIf($["${CALLERID(num)}"="anonymous"]?99:4)
exten => _X.,4,GotoIf($[${CALLERID(num)}:${free_dial}]?99:5)
exten => _X.,5,GotoIf($[${CALLERID(num)}:${free_call}]?99:6)
exten => _X.,6,Dial(${PHONEALL})
exten => _X.,99,Answer()
exten => _X.,n,Hangup

;----------------------------------------------------------------------
; 携帯電話（回線B）からの着信
; 本構成ではキャリア転送で回線Aに送っているため未使用。
; Asterisk で受ける場合はここに処理を書く（chan_mobile.conf の context）。
;----------------------------------------------------------------------
;[from-iphone5s]
;exten => s,1,Dial(${PHONEALL})
;exten => s,n,Hangup
